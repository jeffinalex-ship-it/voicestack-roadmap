name: Update Roadmap

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest CSV
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQDc6UG26BIN3GTUEwL8Vlk-gNFbmmT-FLgVxvVgIkd7VveesvJTHn1SjVU-ytt2p4WbtloqjNtTQe/pub?gid=875976114&single=true&output=csv" -o roadmap.csv

      - name: Rebuild index.html
        run: python3 rebuild.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update roadmap $(date +%Y-%m-%d)"
          git push
